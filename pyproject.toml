[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce-cohort-insights"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "pymongo==4.13.0",
  "redis==6.2.0", "pydantic-settings==2.9.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "black==25.1.0", "ruff==0.11.13", "mypy==1.16.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.black]
line-length = 88

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires running MongoDB and Redis"]
